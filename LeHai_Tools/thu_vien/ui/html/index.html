<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Thư Viện Component</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Bảng màu LeHai (kem + walnut + amber) — đồng bộ shared/lehai_theme.css */
  :root {
    --bg:        #f5f0e8;
    --panel:     #ffffff;
    --border:    rgba(124,45,18,.18);
    --text:      #1c0a00;
    --muted:     #a08060;
    --accent:    #b45309;
    --accent-bg: #fef3c7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  /* thanh cuộn + bôi đen đồng bộ theme */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(124,45,18,.25); border-radius: 999px;
    border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(124,45,18,.45);
    border: 2px solid transparent; background-clip: padding-box; }
  ::selection { background: var(--accent-bg); color: #7c2d12; }
  body {
    font-family: "DM Sans", "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Thanh trên ───────────────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  header .brand { font-weight: 600; font-size: 14px; margin-right: 4px; white-space: nowrap; }
  header input[type="search"] {
    flex: 1;
    min-width: 120px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    outline: none;
  }
  header input[type="search"]:focus { border-color: var(--accent); }
  header button, .empty button {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
  }
  header button:hover, .empty button:hover { background: var(--bg); }

  /* ── Khung chính ──────────────────────────── */
  main { flex: 1; display: flex; min-height: 0; }

  /* ── Sidebar ──────────────────────────────── */
  nav {
    flex: 0 0 200px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 8px 7px;
  }
  nav .section {
    font-size: 10.5px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 10px 5px;
    user-select: none;
  }
  nav button {
    display: flex;
    align-items: center;
    gap: 7px;
    width: 100%;
    text-align: left;
    padding: 7px 9px;
    border: none;
    border-radius: 7px;
    background: none;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
    margin: 1px 0;
  }
  nav button:hover { background: var(--bg); }
  nav button.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  nav .icon { flex: 0 0 auto; display: flex; color: #b0b6be; }
  nav button.active .icon { color: var(--accent); }
  nav .chev {
    flex: 0 0 auto; display: flex; width: 10px;
    color: var(--muted); transition: transform .15s ease;
  }
  nav .chev.open { transform: rotate(90deg); }
  nav .chev.none { visibility: hidden; }
  nav .label { flex: 1; word-break: break-word; min-width: 0; }
  nav .count {
    font-size: 11px; font-weight: 400; color: var(--muted);
    background: var(--bg); border-radius: 999px; padding: 1px 8px; line-height: 1.6;
  }
  nav button.active .count {
    background: rgba(180,83,9,.14); color: var(--accent); font-weight: 600;
  }
  /* Cây n-cấp: thụt bằng padding-left theo độ sâu, không lồng div —
     lồng div thì tới cấp 4-5 là hết chỗ trong sidebar 200px. */
  nav button.depth { font-size: 12.5px; padding-top: 5px; padding-bottom: 5px; }
  nav .chev.hit { cursor: pointer; margin: -4px -2px -4px -4px; padding: 4px 2px 4px 4px; width: 16px; }

  /* ── Phần phải (filter + lưới) ───────────── */
  section { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  /* ── Filter bar ───────────────────────────── */
  #filter-bar {
    flex: 0 0 auto;
    padding: 7px 12px 5px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .filter-row {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 3px 0;
    flex-wrap: wrap;
  }
  .filter-label {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    white-space: nowrap;
    min-width: 68px;
  }
  .filter-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--panel);
    cursor: pointer;
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    transition: border-color .1s, color .1s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip-count { font-size: 11px; opacity: .72; }
  .chip.active .chip-count { opacity: .88; }

  /* ── Lưới thumbnail ───────────────────────── */
  #content { flex: 1; overflow-y: auto; padding: 12px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
    gap: 10px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: box-shadow .12s, border-color .12s;
    position: relative;
  }
  .card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(180,83,9,.18); }
  .card .thumb {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: rgba(124,45,18,.04);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .card .thumb .noimg { font-size: 32px; color: var(--border); }
  .card .name {
    padding: 6px 8px;
    font-size: 12px;
    line-height: 1.3;
    border-top: 1px solid var(--border);
    word-break: break-word;
  }
  .card .name small { display: block; color: var(--muted); margin-top: 2px; }
  .card .dim {
    padding: 2px 8px 4px;
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .card .tags { display: flex; flex-wrap: wrap; gap: 3px; padding: 0 8px 4px; }
  .card .saver { padding: 0 8px 6px; font-size: 10px; color: var(--muted); opacity: .8; }
  .tag {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--accent-bg);
    color: var(--accent);
    font-weight: 500;
  }

  /* ── Card hover buttons (✏ và 🐛) ────────── */
  .card .card-btn {
    position: absolute;
    top: 5px;
    width: 24px;
    height: 24px;
    background: rgba(255,255,255,.92);
    border: 1px solid var(--border);
    border-radius: 5px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    z-index: 2;
    line-height: 1;
  }
  .card:hover .card-btn { display: flex; }
  .card .edit-btn  { right: 5px; }
  .card .bug-btn   { right: 33px; font-size: 12px; }

  /* ── Lưu ý khi dùng (badge + bảng hover) ──── */
  .card .note-badge {
    position: absolute;
    top: 5px;
    left: 5px;
    width: 22px;
    height: 22px;
    background: #fff8e1;
    border: 1px solid #f0d480;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    line-height: 1;
    z-index: 2;
    pointer-events: none;
  }
  #note-tip {
    position: fixed;
    z-index: 50;
    max-width: 250px;
    background: #fff8e1;
    border: 1px solid #f0d480;
    color: #5b4a1f;
    font-size: 12px;
    line-height: 1.45;
    padding: 8px 11px;
    border-radius: 7px;
    box-shadow: 0 4px 16px rgba(0,0,0,.18);
    pointer-events: none;
    display: none;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #note-tip .nt-title {
    font-weight: 600;
    font-size: 11px;
    margin-bottom: 3px;
    opacity: .85;
  }

  /* ── Trạng thái rỗng / lỗi ────────────────── */
  .empty { text-align: center; color: var(--muted); padding: 60px 24px; line-height: 1.7; }
  .empty .big { font-size: 40px; }
  .empty code {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 6px; font-size: 12px; word-break: break-all;
  }

  footer {
    flex: 0 0 auto;
    display: flex;
    gap: 12px;
    padding: 5px 12px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
  }
  footer .root {
    margin-left: auto; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; max-width: 50%;
  }

  /* ── Form lưu / sửa ───────────────────────── */
  .form-label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 3px; }
  .form-input {
    width: 100%;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    background: var(--panel);
    color: var(--text);
  }
  .form-input:focus { outline: none; border-color: var(--accent); }
  .form-chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 10px; }
  .form-chip {
    padding: 4px 11px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--panel);
    cursor: pointer;
    font-size: 12px;
    color: var(--text);
    transition: border-color .1s;
  }
  .form-chip:hover { border-color: var(--accent); }
  .form-chip.active {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  /* ── Cây chọn thư mục trong form Lưu ──────── */
  .pick-tree {
    max-height: 168px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    padding: 4px;
    margin-bottom: 6px;
  }
  .pick-tree button {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    text-align: left;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--text);
    padding: 4px 7px;
    border-radius: 5px;
    margin: 1px 0;
    font-family: inherit;
  }
  .pick-tree button:hover { background: var(--panel); }
  .pick-tree button.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .pick-tree .icon { flex: 0 0 auto; display: flex; color: #b0b6be; }
  .pick-tree button.active .icon { color: var(--accent); }
  .pick-tree .chev {
    flex: 0 0 auto; display: flex; width: 16px; cursor: pointer;
    color: var(--muted); transition: transform .15s ease;
    margin: -4px -2px -4px -4px; padding: 4px 2px 4px 4px;
  }
  .pick-tree .chev.open { transform: rotate(90deg); }
  .pick-tree .chev.none { visibility: hidden; }
  .pick-tree .label { flex: 1; word-break: break-word; min-width: 0; }
  .pick-dest {
    font-size: 11.5px; color: var(--muted); line-height: 1.5;
    margin-bottom: 6px; word-break: break-word;
  }
  .pick-dest b { color: var(--accent); font-weight: 600; }
  .pick-new {
    border: none; background: none; color: var(--accent);
    cursor: pointer; font-size: 12px; padding: 0; margin-bottom: 8px;
    font-family: inherit;
  }
  .pick-new:hover { text-decoration: underline; }

  /* ── Report card (lịch sử) ────────────────── */
  .report-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
  .report-header { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .rbadge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; margin-top: 2px; }
  .rbadge.open  { background: #fde8e8; color: #c0392b; }
  .rbadge.fixed { background: #e6f4ea; color: #1e7e34; }
  .report-meta { flex: 1; }
  .report-title { display: block; font-weight: 600; font-size: 13px; }
  .report-by { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .report-desc { font-size: 12px; color: var(--text); margin-bottom: 6px; white-space: pre-wrap; }
  .report-item-ref { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .report-resolve { font-size: 12px; background: var(--bg); border-radius: 5px; padding: 6px 10px; color: var(--muted); margin-top: 4px; }
  .fix-btn { margin-top: 6px; padding: 4px 12px; background: #28a745; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; }
  .fix-confirm { padding: 4px 12px; background: #28a745; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; }
  .fix-cancel { padding: 4px 10px; border: 1px solid var(--border); border-radius: 5px; background: var(--panel); cursor: pointer; font-size: 12px; }
</style>
</head>
<body>

<div id="note-tip"></div>

<header>
  <span class="brand">📚 Thư Viện</span>
  <input type="search" id="search" placeholder="Tìm kiếm component..." autocomplete="off">
  <button id="btn-save" title="Lưu component đang chọn trong model vào thư viện">⤴ Lưu vào thư viện</button>
  <button id="btn-reports" title="Báo cáo lỗi & lịch sử">📋 Báo cáo</button>
  <button id="btn-refresh" title="Quét lại thư mục thư viện">⟳ Làm mới</button>
  <button id="btn-choose" title="Chọn thư mục thư viện">⚙ Chọn thư viện</button>
</header>

<!-- Overlay lưu component -->
<div id="save-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:10; align-items:center; justify-content:center;">
  <div style="background:var(--panel); border-radius:10px; padding:18px; width:360px; max-height:90vh; overflow-y:auto; box-shadow:0 8px 30px rgba(0,0,0,.25);">
    <div id="save-form-title" style="font-weight:600; font-size:14px; margin-bottom:12px;">⤴ Lưu component vào thư viện</div>

    <label class="form-label">Tên file (không cần .skp)</label>
    <input type="text" id="save-name" class="form-input" style="margin-bottom:4px;" placeholder="vd: TuBep_2canh hoặc BanAn_4chan">
    <div style="font-size:11px; color:var(--muted); margin-bottom:10px;">Tên + đặc điểm nổi bật. Kích thước điền ở dưới, không cần ghi vào tên.</div>

    <div id="save-by-section">
      <label class="form-label">Người lưu</label>
      <input type="text" id="save-saved-by" class="form-input" style="margin-bottom:10px;" placeholder="Tên của bạn">
    </div>

    <div id="save-cat-section">
      <label class="form-label">Lưu vào thư mục</label>
      <div id="save-tree" class="pick-tree"></div>
      <div id="save-dest" class="pick-dest"></div>
      <button type="button" id="save-newfolder-btn" class="pick-new">＋ Tạo thư mục con ở đây</button>
      <input type="text" id="save-newfolder" class="form-input" style="display:none; margin-bottom:8px; border-color:var(--accent);" placeholder="Tên thư mục mới...">
    </div>

    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <div style="flex:1;">
        <label class="form-label">Rộng — R (mm)</label>
        <input type="number" id="save-r" class="form-input" placeholder="vd: 600">
      </div>
      <div style="flex:1;">
        <label class="form-label">Sâu — S (mm)</label>
        <input type="number" id="save-s" class="form-input" placeholder="vd: 560">
      </div>
      <div style="flex:1;">
        <label class="form-label">Cao — C (mm)</label>
        <input type="number" id="save-c" class="form-input" placeholder="vd: 850">
      </div>
    </div>

    <label class="form-label">📌 Lưu ý khi dùng (tùy chọn)</label>
    <textarea id="save-note" class="form-input" rows="3" style="margin-bottom:4px; resize:vertical;" placeholder="vd: Đây là Dynamic Component — gỡ DC trước khi xuất CNC. Nhớ kiểm tra độ dày sau khi scale."></textarea>
    <div style="font-size:11px; color:var(--muted); margin-bottom:12px;">Hiện lên khi rê chuột vào component, trước khi người dùng chèn.</div>

    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <button id="save-cancel" class="form-input" style="width:auto; cursor:pointer;">Hủy</button>
      <button id="save-ok" style="background:var(--accent); color:#fff; border:none; border-radius:6px; padding:6px 16px; cursor:pointer; font-size:13px; font-weight:600;">Lưu vào thư viện</button>
    </div>
  </div>
</div>

<!-- Overlay báo cáo lỗi -->
<div id="report-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:10; align-items:center; justify-content:center;">
  <div style="background:var(--panel); border-radius:10px; padding:18px; width:380px; max-height:90vh; overflow-y:auto; box-shadow:0 8px 30px rgba(0,0,0,.25);">
    <div style="font-weight:600; font-size:14px; margin-bottom:12px;">🐛 Báo cáo lỗi</div>

    <label class="form-label">Tên bạn</label>
    <input type="text" id="report-reporter" class="form-input" style="margin-bottom:10px;" placeholder="vd: Nguyễn Văn A">

    <label class="form-label">Tiêu đề lỗi <span style="color:#c0392b;">*</span></label>
    <input type="text" id="report-title-input" class="form-input" style="margin-bottom:10px;" placeholder="vd: Kích thước sai, file bị hỏng...">

    <label class="form-label">Mô tả chi tiết</label>
    <textarea id="report-desc" class="form-input" rows="4" style="margin-bottom:10px; resize:vertical;" placeholder="Mô tả thêm nếu cần..."></textarea>

    <div id="report-item-info" style="display:none; margin-bottom:12px; padding:8px 10px; background:var(--bg); border-radius:6px; font-size:12px; color:var(--muted);">
      📦 Model: <b id="report-item-label"></b>
    </div>

    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <button id="report-cancel" class="form-input" style="width:auto; cursor:pointer;">Hủy</button>
      <button id="report-ok" style="background:#c0392b; color:#fff; border:none; border-radius:6px; padding:6px 16px; cursor:pointer; font-size:13px; font-weight:600;">Gửi báo cáo</button>
    </div>
  </div>
</div>

<!-- Overlay lịch sử báo cáo -->
<div id="reports-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:10; align-items:center; justify-content:center;">
  <div style="background:var(--panel); border-radius:10px; padding:18px; width:600px; max-height:85vh; display:flex; flex-direction:column; box-shadow:0 8px 30px rgba(0,0,0,.25);">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0;">
      <div style="font-weight:600; font-size:14px;">📋 Lịch sử báo cáo lỗi</div>
      <button id="reports-close" style="border:none; background:none; cursor:pointer; font-size:20px; color:var(--muted); line-height:1; padding:0 4px;">×</button>
    </div>
    <div id="reports-list" style="flex:1; overflow-y:auto; padding-right:4px;"></div>
  </div>
</div>

<main>
  <nav id="categories"></nav>
  <section>
    <div id="content"></div>
  </section>
</main>

<footer>
  <span id="status">Đang tải thư viện...</span>
  <span class="root" id="root-path" title=""></span>
</footer>

<script>
var app = (function () {
  var library = { root: '', exists: true, folders: [], items: [] };
  // activeFolder: null = Tất cả, '' = gốc thư viện, 'A/B/C' = thư mục con bất kỳ cấp
  var activeFolder = null;
  var expanded     = {};
  var searchText   = '';

  var ROOT_LABEL   = 'Chung';
  var saveFolders  = [];
  var saveExpanded = {};          // nhớ nhánh đã mở, giữ qua các lần mở form
  var savePick     = '';
  var isEditMode   = false;
  var editItemPath = null;

  var savedReporter = '';
  var reportTarget  = { name: null, path: null };
  var allReports    = null;

  function su(name, arg) {
    if (window.sketchup && window.sketchup[name]) {
      arg === undefined ? window.sketchup[name]() : window.sketchup[name](arg);
    }
  }

  function fileUrl(path) {
    return 'file:///' + encodeURI(path.replace(/\\/g, '/'));
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  /* ── Cây thư mục: tiện ích chung ────────── */
  // Chọn thư mục cha thì thấy luôn đồ trong mọi nhánh con (giữ nguyên nếp cũ).
  function inFolder(itemFolder, target) {
    if (target === null) return true;
    if (target === '') return true;
    return itemFolder === target || itemFolder.indexOf(target + '/') === 0;
  }

  function depthOf(path) { return path === '' ? 0 : path.split('/').length; }

  function leafName(path) { return path.split('/').pop(); }

  function parentOf(path) {
    var i = path.lastIndexOf('/');
    return i === -1 ? '' : path.substring(0, i);
  }

  function hasChildren(list, path) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].indexOf(path + '/') === 0) return true;
    }
    return false;
  }

  // Chỉ hiện hàng nào có TOÀN BỘ chuỗi cha đang mở.
  function visibleFolders(list, openMap) {
    return list.filter(function (f) {
      var parts = f.split('/');
      for (var i = 1; i < parts.length; i++) {
        if (!openMap[parts.slice(0, i).join('/')]) return false;
      }
      return true;
    });
  }

  // Mở sẵn mọi cấp cha để hàng đang chọn không bị giấu.
  function expandAncestors(path, openMap) {
    var parts = path.split('/');
    for (var i = 1; i < parts.length; i++) openMap[parts.slice(0, i).join('/')] = true;
  }

  function breadcrumb(path) {
    return path === '' ? '' : path.split('/').join(' / ');
  }

  /* ── Filter helpers ─────────────────────── */
  function filteredItems() {
    return library.items.filter(function (it) {
      if (!inFolder(it.folder, activeFolder)) return false;
      if (searchText && it.name.toLowerCase().indexOf(searchText) === -1) return false;
      return true;
    });
  }

  function countOf(folder) {
    return library.items.filter(function (it) {
      return inFolder(it.folder, folder);
    }).length;
  }

  /* ── Sidebar ─────────────────────────────── */
  var SVG_CHEV = '<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>';
  var SVG_GRID = '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1.3"/><rect x="9" y="1" width="6" height="6" rx="1.3"/><rect x="1" y="9" width="6" height="6" rx="1.3"/><rect x="9" y="9" width="6" height="6" rx="1.3"/></svg>';
  var SVG_FOLDER = '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 4A1.5 1.5 0 0 1 3 2.5h2.6c.4 0 .79.16 1.06.44l1.1 1.1c.1.1.23.16.36.16H13A1.5 1.5 0 0 1 14.5 5.7V12A1.5 1.5 0 0 1 13 13.5H3A1.5 1.5 0 0 1 1.5 12V4z"/></svg>';
  var SVG_FOLDER_OPEN = '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 4A1.5 1.5 0 0 1 3 2.5h2.6c.4 0 .79.16 1.06.44l1.1 1.1c.1.1.23.16.36.16H12A1.5 1.5 0 0 1 13.5 5.7v.8H4.6c-.67 0-1.26.44-1.45 1.08L1.5 12.2V4z"/><path d="M4.6 7.5h9.55c.5 0 .86.48.72.96l-1.27 4.3a1.5 1.5 0 0 1-1.44 1.07H2.4c-.5 0-.86-.48-.72-.96l1.48-4.3A1.5 1.5 0 0 1 4.6 7.5z" opacity=".75"/></svg>';

  function renderCategories() {
    var nav  = document.getElementById('categories');
    var keep = nav.scrollTop;                       // cây sâu → giữ chỗ cuộn khi vẽ lại
    var html = navButton(null, SVG_GRID, 'Tất cả', library.items.length, null, 0);
    if (library.folders.length > 0) html += '<div class="section">Thư mục</div>';

    visibleFolders(library.folders, expanded).forEach(function (f) {
      var kids   = hasChildren(library.folders, f);
      var isOpen = !!expanded[f];
      var chev   = kids ? (isOpen ? 'open' : '') : 'none';
      var icon   = (kids && isOpen) ? SVG_FOLDER_OPEN : SVG_FOLDER;
      html += navButton(f, icon, leafName(f), countOf(f), chev, depthOf(f));
    });
    nav.innerHTML = html;
    nav.scrollTop = keep;

    Array.prototype.forEach.call(nav.querySelectorAll('button'), function (btn) {
      btn.onclick = function (e) {
        var f = btn.dataset.folder;
        if (f === undefined || f === '') { activeFolder = null; render(); return; }
        // Bấm trúng mũi tên: chỉ gập/mở, không đổi thư mục đang xem.
        if (e.target.closest && e.target.closest('.chev')) {
          expanded[f] = !expanded[f];
          render();
          return;
        }
        if (activeFolder === f) expanded[f] = !expanded[f];
        else expanded[f] = true;
        activeFolder = f;
        render();
      };
    });
  }

  function navButton(folder, icon, label, count, chevState, depth) {
    var isActive = folder === activeFolder;
    var chev = chevState === null
      ? ''
      : '<span class="chev' + (chevState ? ' ' + chevState : '') +
        (chevState === 'none' ? '' : ' hit') + '">' + SVG_CHEV + '</span>';
    return '<button class="' + (isActive ? 'active' : '') + (depth > 0 ? ' depth' : '') + '"'
         + ' data-folder="' + (folder === null ? '' : esc(folder)) + '"'
         + ' style="padding-left:' + (9 + depth * 13) + 'px">'
         + chev
         + '<span class="icon">' + icon + '</span>'
         + '<span class="label">' + esc(label) + '</span>'
         + '<span class="count">' + count + '</span></button>';
  }

  /* ── Bảng lưu ý khi hover ───────────────── */
  function showNoteTip(card, note) {
    var tip = document.getElementById('note-tip');
    tip.innerHTML = '<div class="nt-title">📌 Lưu ý khi dùng</div>';
    tip.appendChild(document.createTextNode(note));
    tip.style.display = 'block';
    var r  = card.getBoundingClientRect();
    var tr = tip.getBoundingClientRect();
    var left = r.left + r.width / 2 - tr.width / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - tr.width - 8));
    var top = r.top - tr.height - 8;
    if (top < 8) top = r.bottom + 8;            // không đủ chỗ trên → xuống dưới
    tip.style.left = left + 'px';
    tip.style.top  = top + 'px';
  }
  function hideNoteTip() {
    document.getElementById('note-tip').style.display = 'none';
  }

  /* ── Lưới thumbnail ─────────────────────── */
  function renderGrid() {
    var content = document.getElementById('content');

    if (!library.exists) {
      content.innerHTML =
        '<div class="empty"><div class="big">⚠️</div>' +
        '<p><b>Không truy cập được thư mục thư viện.</b></p>' +
        '<p><code>' + esc(library.root) + '</code></p>' +
        '<p>Kiểm tra kết nối ổ mạng / Drive, hoặc chọn lại thư mục.</p>' +
        '<p><button onclick="app.chooseFolder()">⚙ Chọn thư mục thư viện</button> ' +
        '<button onclick="app.refresh()">⟳ Thử lại</button></p></div>';
      return;
    }

    if (library.items.length === 0) {
      content.innerHTML =
        '<div class="empty"><div class="big">📭</div>' +
        '<p><b>Thư viện đang trống.</b></p>' +
        '<p>Hãy chép các file <code>.skp</code> vào thư mục thư viện.<br>' +
        'Thư mục con lồng bao nhiêu cấp cũng được — cây bên trái hiện đúng như trên ổ đĩa.</p></div>';
      return;
    }

    var items = filteredItems();
    if (items.length === 0) {
      content.innerHTML = '<div class="empty"><div class="big">🔍</div>' +
        '<p>Không tìm thấy component nào phù hợp.</p></div>';
      return;
    }

    var html = '<div class="grid">';
    items.forEach(function (it, idx) {
      var thumb = it.thumb
        ? '<img src="' + fileUrl(it.thumb) + '?v=' + (it.thumb_v || 0) + '" alt="" loading="lazy">'
        : '<span class="noimg">◻</span>';
      var where = it.folder ? breadcrumb(it.folder) : ROOT_LABEL;

      var dimParts = [];
      if (it.r) dimParts.push('R' + it.r);
      if (it.s) dimParts.push('S' + it.s);
      if (it.c) dimParts.push('C' + it.c);
      var dimHtml = dimParts.length > 0
        ? '<div class="dim">' + esc(dimParts.join(' × ')) + '</div>'
        : '';

      var saverParts = [];
      if (it.saved_by) saverParts.push(it.saved_by);
      if (it.saved_at) saverParts.push(it.saved_at);
      var saverHtml = saverParts.length > 0
        ? '<div class="saver">' + esc(saverParts.join(' · ')) + '</div>'
        : '';

      var noteBadge = it.note
        ? '<div class="note-badge" title="Có lưu ý khi dùng">📌</div>'
        : '';

      html += '<div class="card" data-idx="' + idx + '" title="Click để chèn: ' + esc(it.name) + '">'
            + '<div class="thumb">' + thumb + '</div>'
            + noteBadge
            + '<div class="card-btn edit-btn" data-path="' + esc(it.path) + '" title="Sửa thông tin">✏</div>'
            + '<div class="card-btn bug-btn" data-name="' + esc(it.name) + '" data-path="' + esc(it.path) + '" title="Báo cáo lỗi">🐛</div>'
            + '<div class="name">' + esc(it.name) + '<small>' + esc(where) + '</small></div>'
            + dimHtml
            + saverHtml
            + '</div>';
    });
    html += '</div>';
    content.innerHTML = html;

    Array.prototype.forEach.call(content.querySelectorAll('.card'), function (card) {
      card.onclick = function () {
        var it = items[parseInt(card.dataset.idx, 10)];
        if (it) su('insert', it.path);
      };
      card.addEventListener('mouseenter', function () {
        var it = items[parseInt(card.dataset.idx, 10)];
        if (it && it.note) showNoteTip(card, it.note);
      });
      card.addEventListener('mouseleave', hideNoteTip);
    });

    Array.prototype.forEach.call(content.querySelectorAll('.edit-btn'), function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        su('edit_dialog', btn.dataset.path);
      };
    });

    Array.prototype.forEach.call(content.querySelectorAll('.bug-btn'), function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        app.showReportForm(btn.dataset.name, btn.dataset.path);
      };
    });
  }

  function renderStatus() {
    var status = document.getElementById('status');
    var rootEl = document.getElementById('root-path');
    if (library.exists) {
      status.textContent = filteredItems().length + ' / ' + library.items.length +
        ' component — click vào hình để chèn vào model';
    } else {
      status.textContent = 'Mất kết nối thư viện';
    }
    rootEl.textContent = library.root;
    rootEl.title = library.root;
  }

  function render() {
    renderCategories();
    renderGrid();
    renderStatus();
  }

  /* ── Lịch sử báo cáo ────────────────────── */
  function renderReportsList() {
    var list = document.getElementById('reports-list');
    if (!allReports || allReports.length === 0) {
      list.innerHTML = '<div style="text-align:center;padding:48px;color:var(--muted);"><div style="font-size:36px;margin-bottom:8px;">✅</div><p>Chưa có báo cáo lỗi nào.</p></div>';
      return;
    }

    var html = '';
    allReports.forEach(function (r, idx) {
      var isFixed  = r.status === 'fixed';
      var dateStr  = (r.created_at || '').substring(0, 10);
      var badge    = isFixed
        ? '<span class="rbadge fixed">✓ Đã fix</span>'
        : '<span class="rbadge open">● Đang mở</span>';

      html += '<div class="report-card">';
      html += '<div class="report-header">' + badge + '<div class="report-meta">';
      html += '<span class="report-title">' + esc(r.title) + '</span>';
      html += '<span class="report-by">' + esc(r.reporter || 'Ẩn danh') + ' · ' + dateStr + '</span>';
      html += '</div></div>';

      if (r.description) {
        html += '<p class="report-desc">' + esc(r.description) + '</p>';
      }
      if (r.item_name) {
        html += '<p class="report-item-ref">📦 ' + esc(r.item_name) + '</p>';
      }
      if (isFixed && r.resolve_note) {
        html += '<p class="report-resolve">🔧 ' + esc(r.resolve_note) + '</p>';
      }
      if (!isFixed) {
        html += '<div class="fix-area" data-idx="' + idx + '">';
        html += '<button class="fix-btn" data-idx="' + idx + '">✓ Đánh dấu đã fix</button>';
        html += '<div class="fix-form" style="display:none; margin-top:8px;">';
        html += '<input type="text" class="form-input fix-note" placeholder="Ghi chú cách fix (tùy chọn)" style="margin-bottom:6px;">';
        html += '<div style="display:flex; gap:6px;">';
        html += '<button class="fix-confirm" data-idx="' + idx + '">Xác nhận</button>';
        html += '<button class="fix-cancel">Hủy</button>';
        html += '</div></div></div>';
      }
      html += '</div>';
    });
    list.innerHTML = html;

    Array.prototype.forEach.call(list.querySelectorAll('.fix-btn'), function (btn) {
      btn.onclick = function () {
        var area = btn.parentElement;
        btn.style.display = 'none';
        area.querySelector('.fix-form').style.display = 'block';
        area.querySelector('.fix-note').focus();
      };
    });

    Array.prototype.forEach.call(list.querySelectorAll('.fix-cancel'), function (btn) {
      btn.onclick = function () {
        var area = btn.closest('.fix-area');
        area.querySelector('.fix-btn').style.display = '';
        area.querySelector('.fix-form').style.display = 'none';
      };
    });

    Array.prototype.forEach.call(list.querySelectorAll('.fix-confirm'), function (btn) {
      btn.onclick = function () {
        var idx    = parseInt(btn.dataset.idx, 10);
        var area   = btn.closest('.fix-area');
        var note   = area.querySelector('.fix-note').value.trim();
        var report = allReports[idx];
        if (report) {
          su('resolve_report', JSON.stringify({ file: report.file, note: note }));
        }
      };
    });
  }

  document.getElementById('search').addEventListener('input', function (e) {
    searchText = e.target.value.trim().toLowerCase();
    render();
  });
  document.getElementById('btn-refresh').onclick = function () { su('refresh'); };
  document.getElementById('btn-choose').onclick  = function () { su('choose_folder'); };

  /* ── Form "Lưu vào thư viện": cây chọn thư mục ── */
  function renderSaveTree() {
    var box  = document.getElementById('save-tree');
    var keep = box.scrollTop;
    var html = pickButton('', SVG_GRID, 'Thư viện (gốc)', null, 0);

    visibleFolders(saveFolders, saveExpanded).forEach(function (f) {
      var kids   = hasChildren(saveFolders, f);
      var isOpen = !!saveExpanded[f];
      var chev   = kids ? (isOpen ? 'open' : '') : 'none';
      var icon   = (kids && isOpen) ? SVG_FOLDER_OPEN : SVG_FOLDER;
      html += pickButton(f, icon, leafName(f), chev, depthOf(f));
    });
    box.innerHTML = html;
    box.scrollTop = keep;

    Array.prototype.forEach.call(box.querySelectorAll('button'), function (btn) {
      btn.onclick = function (e) {
        var f = btn.dataset.folder;
        if (f !== '' && e.target.closest && e.target.closest('.chev')) {
          saveExpanded[f] = !saveExpanded[f];
          renderSaveTree();
          return;
        }
        if (f !== '') saveExpanded[f] = true;
        savePick = f;
        renderSaveTree();
        renderSaveDest();
      };
    });
  }

  function pickButton(folder, icon, label, chevState, depth) {
    var chev = chevState === null
      ? '<span class="chev none">' + SVG_CHEV + '</span>'
      : '<span class="chev' + (chevState ? ' ' + chevState : '') + '">' + SVG_CHEV + '</span>';
    return '<button type="button" class="' + (folder === savePick ? 'active' : '') + '"'
         + ' data-folder="' + esc(folder) + '"'
         + ' style="padding-left:' + (7 + depth * 13) + 'px">'
         + chev
         + '<span class="icon">' + icon + '</span>'
         + '<span class="label">' + esc(label) + '</span></button>';
  }

  function newFolderName() {
    var input = document.getElementById('save-newfolder');
    return input.style.display === 'none' ? '' : input.value.trim();
  }

  // Đường dẫn cuối cùng gửi xuống Ruby: '' = gốc, 'A/B/C' = lồng bao nhiêu cấp cũng được.
  function targetFolder() {
    var extra = newFolderName();
    if (!extra) return savePick;
    return savePick === '' ? extra : savePick + '/' + extra;
  }

  function renderSaveDest() {
    var path = targetFolder();
    document.getElementById('save-dest').innerHTML =
      'Sẽ lưu vào: <b>' + (path === '' ? '📚 Thư viện (gốc)' : esc(breadcrumb(path))) + '</b>';
  }

  function hideSaveForm() {
    document.getElementById('save-overlay').style.display = 'none';
    isEditMode   = false;
    editItemPath = null;
    document.getElementById('save-form-title').textContent = '⤴ Lưu component vào thư viện';
    document.getElementById('save-ok').textContent = 'Lưu vào thư viện';
    document.getElementById('save-cat-section').style.display = '';
    document.getElementById('save-by-section').style.display = '';
  }

  document.getElementById('save-newfolder-btn').onclick = function () {
    var input = document.getElementById('save-newfolder');
    var opening = input.style.display === 'none';
    input.style.display = opening ? 'block' : 'none';
    if (!opening) input.value = '';
    this.textContent = opening ? '✕ Bỏ tạo thư mục mới' : '＋ Tạo thư mục con ở đây';
    renderSaveDest();
    if (opening) input.focus();
  };
  document.getElementById('save-newfolder').addEventListener('input', renderSaveDest);
  document.getElementById('save-cancel').onclick = hideSaveForm;
  document.getElementById('save-overlay').addEventListener('click', function (e) {
    if (e.target === this) hideSaveForm();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      hideSaveForm();
      document.getElementById('report-overlay').style.display = 'none';
      document.getElementById('reports-overlay').style.display = 'none';
    }
  });

  document.getElementById('save-ok').onclick = function () {
    var name = document.getElementById('save-name').value.trim();
    if (!name) { document.getElementById('save-name').focus(); return; }
    var r = document.getElementById('save-r').value.trim();
    var s = document.getElementById('save-s').value.trim();
    var c = document.getElementById('save-c').value.trim();
    var note = document.getElementById('save-note').value.trim();

  document.addEventListener('DOMContentLoaded', function () { su('ready'); });

  return {
    setLibrary: function (data) {
      library = data || { root: '', exists: true, folders: [], items: [] };
      if (!library.folders) library.folders = [];
      if (data && data.reporter_name !== undefined) savedReporter = data.reporter_name;
      // Thư mục vừa xem có thể đã bị xóa/đổi tên ngoài Explorer → quay về Tất cả.
      if (activeFolder && library.folders.indexOf(activeFolder) === -1) activeFolder = null;
      render();
    },
    openFolder:   function () { su('open_folder'); },
    chooseFolder: function () { su('choose_folder'); },
    refresh:      function () { su('refresh'); },
    showSaveForm: function (info) {
      saveFolders = (info && info.folders) || [];
      document.getElementById('save-name').value = (info && info.name) || '';
      document.getElementById('save-saved-by').value = (info && info.saved_by) || savedReporter;
      document.getElementById('save-r').value = '';
      document.getElementById('save-s').value = '';
      document.getElementById('save-c').value = '';
      document.getElementById('save-note').value = '';

      // Ô tạo thư mục mới luôn khởi động ở trạng thái đóng.
      var nf = document.getElementById('save-newfolder');
      nf.value = '';
      nf.style.display = 'none';
      document.getElementById('save-newfolder-btn').textContent = '＋ Tạo thư mục con ở đây';

      // Chọn sẵn đúng thư mục đang xem bên trái; nhánh mở giữ nguyên từ lần trước.
      savePick = (activeFolder && saveFolders.indexOf(activeFolder) !== -1) ? activeFolder : '';
      if (savePick) expandAncestors(savePick, saveExpanded);
      renderSaveTree();
      renderSaveDest();

      document.getElementById('save-overlay').style.display = 'flex';
      document.getElementById('save-name').focus();
      document.getElementById('save-name').select();
    },
    showEditForm: function (info) {
      isEditMode   = true;
      editItemPath = info.path;
      document.getElementById('save-form-title').textContent = '✏ Sửa thông tin';
      document.getElementById('save-ok').textContent = 'Lưu thay đổi';
      document.getElementById('save-name').value = info.name || '';
      document.getElementById('save-r').value = info.r || '';
      document.getElementById('save-s').value = info.s || '';
      document.getElementById('save-c').value = info.c || '';
      document.getElementById('save-note').value = info.note || '';
      document.getElementById('save-cat-section').style.display = 'none';
      document.getElementById('save-by-section').style.display = 'none';
      document.getElementById('save-overlay').style.display = 'flex';
      document.getElementById('save-name').focus();
      document.getElementById('save-name').select();
    },
    showReportForm: function (itemName, itemPath) {
      reportTarget = { name: itemName || null, path: itemPath || null };
      document.getElementById('report-reporter').value = savedReporter;
      document.getElementById('report-title-input').value = '';
      document.getElementById('report-desc').value = '';
      var info = document.getElementById('report-item-info');
      if (itemName) {
        document.getElementById('report-item-label').textContent = itemName;
        info.style.display = 'block';
      } else {
        info.style.display = 'none';
      }
      document.getElementById('report-overlay').style.display = 'flex';
      document.getElementById('report-title-input').focus();
    },
    showReportsOverlay: function () {
      document.getElementById('reports-overlay').style.display = 'flex';
      if (allReports === null) {
        document.getElementById('reports-list').innerHTML =
          '<div style="text-align:center;padding:40px;color:var(--muted);">Đang tải...</div>';
        su('load_reports');
      } else {
        renderReportsList();
      }
    },
    setReports: function (data) {
      allReports = data || [];
      renderReportsList();
    }
  };
})();
</script>
</body>
</html>
