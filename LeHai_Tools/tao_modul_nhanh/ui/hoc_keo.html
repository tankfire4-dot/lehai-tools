<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<title>Hộc kéo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/lehai_theme.css">
<style>
  html, body { height: 100%; margin: 0; }
  .khung { display: grid; grid-template-columns: 270px 1fr; gap: 16px; height: 100%;
           box-sizing: border-box; padding: 16px; }
  .trai { display: flex; flex-direction: column; min-height: 0; }
  .ve-menu { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
             color: var(--lh-amber); text-decoration: none; }
  .ve-menu:hover { text-decoration: underline; }
  #cuon { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px; margin: 0 -8px; }
  .nhom { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
          color: var(--lh-muted); margin: 14px 0 6px; }
  .the.tat { margin-bottom: 8px; background: var(--lh-chip); }
  .the.tat .lh-btn { width: 100%; margin-top: 8px; }
  .nhom-nut { display: flex; align-items: center; justify-content: space-between; }
  .nhom-nut .lh-btn { padding: 3px 10px; font-size: 11px; letter-spacing: 0; text-transform: none; width: auto; }
  .o.dang { background: var(--lh-chip); border-radius: var(--lh-radius-sm); }
  .o { display: grid; grid-template-columns: 1fr 76px; align-items: center; gap: 8px; padding: 3px 0; }
  .o label { font-size: 12.5px; color: var(--lh-ink-soft); }
  .o .lh-input, .o select { width: 100%; box-sizing: border-box; text-align: right; }
  .the { font-size: 12.5px; color: var(--lh-ink-soft); background: var(--lh-surface);
         border-radius: var(--lh-radius-sm); box-shadow: var(--lh-shadow); padding: 8px 10px; line-height: 1.55; }
  .the b { color: var(--lh-ink); font-weight: 600; }
  .the .mo { color: var(--lh-muted); font-size: 11.5px; }
  .hang { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .khoang label { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--lh-ink-soft);
                  padding: 4px 0; cursor: pointer; }
  .khoang label span.so { color: var(--lh-muted); margin-left: auto; }
  .khoang label.tat { opacity: .5; }
  .day { margin-top: 10px; }
  .day .lh-btn { width: 100%; }
  .day .lh-btn:disabled { opacity: .45; cursor: not-allowed; }
  #nhac:empty { display: none; }
  .phai { display: flex; flex-direction: column; min-height: 0; background: var(--lh-surface);
          border-radius: var(--lh-radius); box-shadow: var(--lh-shadow); padding: 8px; }
  .cu { display: flex; align-items: center; gap: 8px; margin: 2px 4px 6px; }
  .cu .ten { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--lh-muted); }
  .cu .goi { margin-left: auto; font-size: 11px; color: var(--lh-muted); text-align: right; }
  .cu .lh-btn { width: auto; flex: none; padding: 5px 12px; font-size: 12px; }
  .o.rong { grid-template-columns: auto 1fr; }
  .o.rong select { text-align: left; }
  #nen { flex: 1; min-height: 0; position: relative; }
  #c3d { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  #c3d.keo { cursor: grabbing; }
  #tro { position: absolute; pointer-events: none; background: var(--lh-ink); color: #fff; font-size: 12px;
         padding: 4px 8px; border-radius: 6px; white-space: nowrap; display: none; }
  #tom { font-size: 12px; color: var(--lh-ink-soft); margin: 6px 4px 2px; line-height: 1.6; }
  #tom b { color: var(--lh-ink); font-weight: 600; }
</style></head>
<body class="lh"><div class="khung">
  <div class="trai">
    <a class="ve-menu" href="#" onclick="if (window.sketchup) sketchup.mo_menu(); return false;">‹ Tạo Modul Nhanh</a>
    <div class="lh-title">Hộc kéo</div>
    <div id="cuon">
      <div class="nhom">Khoang</div>
      <div class="the tat" id="tat" hidden>
        Tool chọn khoang đang tắt (vừa bấm tool khác).
        <button class="lh-btn lh-btn--primary" id="chontiep">▶ Chọn khoang tiếp</button>
      </div>
      <div class="the" id="khung">—</div>

      <div class="nhom">Kiểu mặt</div>
      <div class="lh-chips" id="kieu">
        <button class="lh-chip is-active" data-k="lot">Lọt</button>
        <button class="lh-chip" data-k="phu">Phủ</button>
      </div>

      <div class="nhom">Hộc</div>
      <div class="o" id="dong_so_hoc"><label for="so_hoc">Chia mấy hộc trong khoang</label>
        <input class="lh-input" id="so_hoc" type="number" min="1" max="8" step="1" value="1"></div>
      <div class="khoang" id="khoang"></div>
      <div class="o rong"><label for="ray">Ray</label><select class="lh-input" id="ray"></select></div>

      <div class="nhom nhom-nut">Thông số (mm)
        <button class="lh-btn lh-btn--ghost" id="macdinh" title="Trả mọi ô số, ray, số hộc về mặc định xưởng">Về mặc định</button></div>
      <div id="form"></div>
    </div>
    <div class="day">
      <div id="nhac" class="lh-status"></div>
      <button class="lh-btn lh-btn--primary" id="dung" disabled>Tạo hộc kéo</button>
    </div>
  </div>
  <div class="phai">
    <div class="cu">
      <span class="ten">Xem 3D</span>
      <button class="lh-btn lh-btn--ghost" id="rut">Rút hộc ra</button>
      <button class="lh-btn lh-btn--ghost" id="goc">Nhìn lại</button>
      <span class="goi">bấm vào ô số → 3D phóng tới chỗ đó · kéo chuột: xoay · lăn: phóng · rê vào tấm: kích thước</span>
    </div>
    <div id="nen"><canvas id="c3d"></canvas><div id="tro"></div></div>
    <div id="tom"></div>
  </div>
</div>

<script src="ve3d.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  var NHO = 'lehai.taomodul.hockeo.thu';

  var hoi = [], khung = null, tamKhung = [], kq = null, kieu = 'lot', bo = [], hen = null, daKhoa = false, khoaCu = '';

  function docNho() { try { return JSON.parse(localStorage.getItem(NHO)) || {}; } catch (e) { return {}; } }
  function ghiNho(v) { try { localStorage.setItem(NHO, JSON.stringify(v)); } catch (e) {} }
  function so(v) { return Math.round(v * 10) / 10; }
  function nhac(msg, loai) {
    $('nhac').textContent = msg || '';
    $('nhac').className = 'lh-status' + (loai ? ' lh-status--' + loai : '');
  }

  // ── Ruby đẩy ô thông số + mặc định từ lõi (một lần khi mở bảng) ──
  window.khoiDau = function (d) {
    hoi = d.hoi;
    var nho = docNho(), html = '';
    hoi.forEach(function (t) {
      var v = nho[t.khoa] != null ? nho[t.khoa] : t.mac_dinh;
      html += '<div class="o"><label for="o_' + t.khoa + '">' + t.nhan + '</label>' +
              '<input class="lh-input" id="o_' + t.khoa + '" type="number" min="0" step="0.5" value="' + v + '"></div>';
    });
    $('form').innerHTML = html;
    hoi.forEach(function (t) {
      $('o_' + t.khoa).addEventListener('input', guiTinh);
      $('o_' + t.khoa).addEventListener('focus', function () { chonO(t.khoa); });
    });
    var r = '<option value="tu" id="ray_tu">Tự chọn</option>';
    d.ray_co.forEach(function (x) { r += '<option value="' + x + '">' + so(x) + '</option>'; });
    $('ray').innerHTML = r;
    if (nho.kieu_mat) datKieu(nho.kieu_mat, true);
    if (nho.so_hoc) $('so_hoc').value = nho.so_hoc;
    datKhoang(null);
    guiTinh();
  };

  // ── Khoang chuột đang rê / đã click chọn (null = chưa có) ──
  window.datKhoang = function (d) {
    if (!d) {
      khung = null; tamKhung = []; kq = null; daKhoa = false; khoaCu = '';
      $('khung').innerHTML = '<span class="mo">Rê chuột vào TRONG lòng khoang trên model để xem trước, click để chọn.</span>';
      $('khoang').innerHTML = ''; $('tom').innerHTML = '';
      $('dung').disabled = true;
      ve(); return;
    }
    var k = d.khung, moi = [k.x, k.z, k.y_truoc].join();
    if (moi !== khoaCu) { khoaCu = moi; bo = []; if (khoa3d) setTimeout(function () { bayToi(khoa3d, 0); }, 0); }
    khung = k; tamKhung = d.tam_khung; daKhoa = d.khoa;
    $('khung').innerHTML =
      (daKhoa ? '<b style="color:#15803d">ĐÃ CHỌN</b>' : '<span class="mo">Đang xem — click trên model để chọn</span>') + '<br>' +
      'Lòng: <b>' + so(k.x[1] - k.x[0]) + ' × ' + so(k.z[1] - k.z[0]) + ' × ' + so(k.y_sau - k.y_truoc) + '</b><br>' +
      '<span class="mo">' + (k.co_hau ? 'Có hậu' : 'Không hậu — đo tới mép sau hông') + '</span>' +
      (k.da_co_hoc ? '<br><b style="color:#b91c1c">Khoang này đã có hộc kéo</b>' : '');
    ve();
  };

  function datKieu(k, im) {
    kieu = k;
    Array.prototype.forEach.call($('kieu').children, function (b) { b.classList.toggle('is-active', b.dataset.k === k); });
    if (!im) guiTinh();
  }
  $('kieu').addEventListener('click', function (e) { if (e.target.dataset.k) datKieu(e.target.dataset.k); });
  $('so_hoc').addEventListener('input', function () { bo = []; guiTinh(); });
  $('ray').addEventListener('change', guiTinh);
  // Ruby báo tool chọn khoang tắt/bật (tắt = người dùng bấm tool khác mà bảng còn mở)
  window.toolTat = function (tat) { $('tat').hidden = !tat; };
  $('chontiep').addEventListener('click', function () { if (window.sketchup) sketchup.chon_tiep(); });
  // Bảng nhớ số lần trước → gõ nhầm một lần là nhớ mãi (Khoa 27/09: khe ray 50). Nút này trả về
  // mặc định LẤY TỪ LÕI Ruby (hoi[].mac_dinh), JS không giữ bản sao số nào. Giữ nguyên lọt/phủ.
  $('macdinh').addEventListener('click', function () {
    hoi.forEach(function (t) { $('o_' + t.khoa).value = t.mac_dinh; });
    $('ray').value = 'tu'; $('so_hoc').value = 1; bo = [];
    guiTinh();
  });

  function giaTri() {
    var v = { kieu_mat: kieu, so_hoc: $('so_hoc').value, ray: $('ray').value, bo: bo };
    hoi.forEach(function (t) { v[t.khoa] = $('o_' + t.khoa).value; });
    return v;
  }

  function guiTinh() {
    clearTimeout(hen);
    hen = setTimeout(function () {
      var v = giaTri();
      var nho = {}; for (var k in v) if (k !== 'bo' && k !== 'ray') nho[k] = v[k];
      ghiNho(nho);
      if (window.sketchup) sketchup.tinh(JSON.stringify(v));
    }, 120);
  }

  window.veLai = function (d) {
    kq = d; nhac(''); $('dung').disabled = !(daKhoa && d.tam.length);
    if ($('ray').value === 'tu') $('ray_tu').textContent = 'Tự chọn · ' + so(d.ray);   // ray dài nhất còn lọt khoang, lõi Ruby chọn
    // danh sách khoang có tick — Hộc 1 = trên cùng
    var html = '';
    d.khoang.forEach(function (k) {
      html += '<label class="' + (k.gan ? '' : 'tat') + '"><input type="checkbox" data-so="' + k.so + '"' + (k.gan ? ' checked' : '') +
              '> Hộc ' + k.so + '<span class="so">khoang cao ' + so(k.cao) + '</span></label>';
    });
    $('khoang').innerHTML = html;
    var hk = {};   // hông trái từng hộc → cao hông
    d.tam.forEach(function (s) { var m = s.ten.match(/^(Hộc \d+) · hông trái/); if (m) hk[m[1]] = s; });
    var t = [];
    Object.keys(hk).forEach(function (h) {
      var s = hk[h];
      t.push(h + ': hông <b>' + so(s.z[1] - s.z[0]) + '</b> × dài <b>' + so(s.y[1] - s.y[0]) + '</b>');
    });
    var tr = hk['Hộc 1'] || hk[Object.keys(hk)[0]];
    $('tom').innerHTML = 'Ray <b>' + so(d.ray) + '</b>' +
      (tr ? ' · thùng rộng <b>' + so(khung.x[1] - khung.x[0] - 2 * d.tham_so.khe_ray) + '</b>' : '') +
      (t.length ? '<br>' + t.join(' · ') : '') +
      (d.canh_bao ? '<br><b style="color:#b45309">⚠ ' + d.canh_bao + '</b>' : '') +
      (khung.tam_roi && d.tham_so.kieu_mat === 'phu' ?
        '<br><span style="color:#a08060">Khung là các tấm rời (chưa gom một group): mặt phủ không nhận ra đố/vách kề, phủ tới mép ngoài tấm.</span>' : '');
    ve();
  };
  $('khoang').addEventListener('change', function (e) {
    var n = +e.target.dataset.so;
    if (!n) return;
    bo = bo.filter(function (x) { return x !== n; });
    if (!e.target.checked) bo.push(n);
    guiTinh();
  });
  window.baoLoi = function (m) { nhac(m, 'bad'); $('dung').disabled = true; };   // thông số sai / dò lỗi
  window.baoLoiDung = function (m) { nhac(m, 'bad'); $('dung').disabled = false; };
  window.xong = function (m) { nhac(m, 'ok'); $('dung').disabled = false; };

  $('dung').addEventListener('click', function () {
    $('dung').disabled = true;
    nhac('Đang tạo…');
    if (window.sketchup) sketchup.dung(JSON.stringify(giaTri()));
  });

  // ── 3D: bộ vẽ dùng chung ui/ve3d.js (một bộ vẽ cho mọi modul Tạo Modul Nhanh) ──
  // Hình lấy NGUYÊN từ danh sách tấm lõi Ruby gửi sang — JS không có công thức kết cấu nào.
  var v3 = new Ve3D($('c3d'), $('tro'));
  var rut = 0, rutDich = 0;
  $('goc').addEventListener('click', function () { chonO(null); });
  $('ray').addEventListener('focus', function () { chonO('ray'); });
  $('so_hoc').addEventListener('focus', function () { chonO('so_hoc'); });
  $('rut').addEventListener('click', function () {
    rutDich = rutDich ? 0 : 1;
    $('rut').textContent = rutDich ? 'Đẩy hộc vào' : 'Rút hộc ra';
    chay();
  });
  function chay() {   // trượt hộc ra/vào cho mắt theo kịp
    var b = rutDich - rut;
    if (Math.abs(b) < 0.01) { rut = rutDich; ve(); return; }
    rut += b * 0.2; ve(); requestAnimationFrame(chay);
  }
  // ── Bảng tra: ô nào → phóng tới đâu + tấm nào nổi (khuôn chung các modul, Khoa 27/09) ──
  // MỘT hướng nhìn chuẩn: bấm ô chỉ trượt + phóng, tấm liên quan đặc + viền cam, tấm khác làm mờ.
  // Mọi khe chính luôn kẻ mờ ở ĐÚNG vị trí thật; ô đang sửa thì số sáng. Số lấy nguyên từ thông số
  // + vị trí tấm lõi Ruby trả về — JS chỉ kẻ đường, không công thức kết cấu.
  var khoa3d = null;
  // Tấm liên quan từng ô (tên phần sau "Hộc N · ")
  var TAM_CUA_O = {
    van: ['hông trái'], khe_ray: ['hông trái'], van_day: ['đáy'], ranh_day: ['đáy', 'hông phải'],
    cach_day: ['đáy'], thap_hon_noc: ['hông trái', 'hông phải'], khe_mat: ['mat'], khe_phu: ['mat'],
    khe_sau: ['hông sau'], ray: ['hông trái', 'hông phải'], gia_ray: ['hông trái', 'hông phải']
  };

  // Tấm của hộc đang xem (hộc có số nhỏ nhất còn gắn) + khoang của nó
  function hocDau() {
    if (!kq || !kq.tam.length) return null;
    var so1 = kq.tam[0].ten.split(' · ')[0], h = { so: so1 };
    kq.tam.forEach(function (s) {
      var p = s.ten.split(' · ');
      if (p[0] === so1) h[p[1] === 'mặt lọt' || p[1] === 'mặt phủ' ? 'mat' : p[1]] = s;
    });
    var kh = kq.khoang.filter(function (x) { return 'Hộc ' + x.so === so1; })[0];
    h.khoang = kh ? kh.z : khung.z;
    return h;
  }

  // Đường kích thước của hộc đang xem: { khoa: [a, b, chữ] } — vị trí thật, dùng cho cả vẽ lẫn phóng
  function duongKich() {
    var h = hocDau();
    if (!h || !kq) return {};
    var p = kq.tham_so, x0 = khung.x[0], T = h['hông trái'], P = h['hông phải'], D = h['đáy'], S = h['hông sau'], M = h.mat;
    var kz = h.khoang, yt = khung.y_truoc - 1, xd = x0 + 40;   // kẻ trên mặt trước khoang, lệch vào 40
    var d = {
      khe_ray: [[x0, T.y[0], T.z[1]], [T.x[0], T.y[0], T.z[1]], so(T.x[0] - x0)],
      van: [[T.x[0], T.y[0] + 60, T.z[1]], [T.x[1], T.y[0] + 60, T.z[1]], so(T.x[1] - T.x[0])],
      cach_day: [[xd, yt, kz[0]], [xd, yt, T.z[0]], so(T.z[0] - kz[0])],
      thap_hon_noc: [[xd, yt, T.z[1]], [xd, yt, kz[1]], so(kz[1] - T.z[1])],
      khe_sau: [[T.x[0] + 30, T.y[1], T.z[1]], [T.x[0] + 30, khung.y_sau, T.z[1]], so(khung.y_sau - T.y[1]) + ' (cần ≥ ' + so(p.khe_sau) + ')'],
      ray: [[P.x[1] + 25, T.y[0], T.z[1]], [P.x[1] + 25, T.y[1], T.z[1]], 'thùng ' + so(T.y[1] - T.y[0]) + ' · ray ' + so(kq.ray)]
    };
    d.gia_ray = d.ray;   // cùng đường dài thùng: chữ ghi cả thùng lẫn ray
    if (D) {
      d.van_day = [[P.x[0] - 30, D.y[0], D.z[0]], [P.x[0] - 30, D.y[0], D.z[1]], so(D.z[1] - D.z[0])];
      d.ranh_day = [[P.x[0], D.y[0], D.z[0] - 8], [D.x[1], D.y[0], D.z[0] - 8], so(D.x[1] - P.x[0])];
    }
    if (M && p.kieu_mat === 'lot' && M.x[0] > x0) d.khe_mat = [[x0, M.y[0] - 1, (M.z[0] + M.z[1]) / 2], [M.x[0], M.y[0] - 1, (M.z[0] + M.z[1]) / 2], so(M.x[0] - x0)];
    if (M && p.kieu_mat === 'phu') d.khe_phu = [[x0 + 30, M.y[1], M.z[1] - 30], [x0 + 30, khung.y_truoc, M.z[1] - 30], so(khung.y_truoc - M.y[1])];
    return d;
  }

  function chonO(k) {
    Array.prototype.forEach.call(document.querySelectorAll('.o'), function (o) { o.classList.remove('dang'); });
    var el = k && $(k === 'ray' || k === 'so_hoc' ? k : 'o_' + k);
    if (el && el.closest) el.closest('.o').classList.add('dang');
    khoa3d = k;
    if (k && TAM_CUA_O[k] && rutDich) { rutDich = 0; rut = 0; $('rut').textContent = 'Rút hộc ra'; }
    ve();
    bayToi(k);
  }

  // Phóng tới giữa đường kích thước của ô (giữ hướng nhìn); ô không có đường → cả khoang
  function bayToi(k, ms) {
    var d = duongKich()[k];
    if (!khung || !d) { v3.phong(null, 1, ms); return; }
    v3.phong([0, 1, 2].map(function (i) { return (d[0][i] + d[1][i]) / 2; }), 1.7, ms);   // phóng vừa phải: thấy khe mà vẫn thấy cả thùng xung quanh
  }

  function ve() {
    if (!khung) { v3.kich([]); v3.dat([]); return; }
    var dich = kq ? rut * kq.ray * 0.6 : 0;   // rút hộc ra 60% chiều dài ray
    // căn giữa + tỉ lệ theo KHOANG (không theo hộc) → rút hộc ra không làm hình co giãn
    var lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
    tamKhung.forEach(function (s) {
      [s.x, s.y, s.z].forEach(function (a, i) { lo[i] = Math.min(lo[i], a[0]); hi[i] = Math.max(hi[i], a[1]); });
    });
    var ds = tamKhung.map(function (s) { return { s: s, loai: 'nen' }; });
    var h = hocDau(), noi = khoa3d && TAM_CUA_O[khoa3d];
    if (kq) kq.tam.forEach(function (s) {
      var p = s.ten.split(' · '), phan = p[1] === 'mặt lọt' || p[1] === 'mặt phủ' ? 'mat' : p[1];
      var laNoi = !!noi && h && p[0] === h.so && noi.indexOf(phan) >= 0;
      ds.push({ s: s, loai: 'tam', dy: -dich, noi: laNoi, mo: !!noi && !laNoi });
    });

    // Mọi khe chính kẻ mờ ở vị trí thật; ô đang sửa sáng. Đang rút hộc thì thôi kẻ (thùng đã dời chỗ).
    var K = [];
    if (!dich) {
      var d = duongKich();
      Object.keys(d).forEach(function (k) { K.push({ a: d[k][0], b: d[k][1], chu: d[k][2], sang: k === khoa3d }); });
    }
    v3.kich(K);
    v3.dat(ds, tamKhung.length ? [lo, hi] : null);
  }
  if (window.sketchup) sketchup.ready();
</script>
