<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<title>Khung bao tủ lạnh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/lehai_theme.css">
<style>
  html, body { height: 100%; }
  .khung { display: grid; grid-template-columns: 240px 1fr; gap: 16px; height: 100%;
           box-sizing: border-box; padding: 16px; }
  .trai { display: flex; flex-direction: column; min-height: 0; }
  .ve-menu { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
             color: var(--lh-amber); text-decoration: none; }
  .ve-menu:hover { text-decoration: underline; }
  #form { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px; margin: 0 -8px; }
  .o { display: grid; grid-template-columns: 1fr 76px; align-items: center; gap: 8px;
       padding: 5px 8px; margin: 0 -8px; border-radius: var(--lh-radius-sm); }
  .o.dang { background: var(--lh-chip); }
  .o label { font-size: 12.5px; color: var(--lh-ink-soft); }
  .o .lh-input { width: 100%; box-sizing: border-box; text-align: right; }
  .nhom { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
          color: var(--lh-muted); margin: 12px 0 4px; }
  .nhom:first-of-type { margin-top: 4px; }
  .tinh { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--lh-muted);
          padding: 5px 0; border-top: 1px dashed var(--lh-line); margin-top: 8px; }
  .tinh b { color: var(--lh-ink-soft); font-weight: 600; }
  .day { margin-top: auto; }
  .day .lh-btn { width: 100%; }
  .day .lh-btn:disabled { opacity: .45; cursor: not-allowed; }
  .phai { display: flex; flex-direction: column; min-height: 0; background: var(--lh-surface);
          border-radius: var(--lh-radius); box-shadow: var(--lh-shadow); padding: 8px; }
  .cu { display: flex; align-items: center; gap: 8px; margin: 2px 4px 6px; }
  .cu .ten { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--lh-muted); }
  .cu .lh-btn { width: auto; flex: none; padding: 5px 12px; font-size: 12px; }
  .cu .goi { margin-left: auto; font-size: 11px; color: var(--lh-muted); text-align: right; }
  #nen { flex: 1; min-height: 0; position: relative; }
  #c3d { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  #c3d.keo { cursor: grabbing; }
  #tro { position: absolute; pointer-events: none; background: var(--lh-ink); color: #fff; font-size: 12px;
         padding: 4px 8px; border-radius: 6px; white-space: nowrap; display: none; }
  #cheDo { font-size: 12px; color: var(--lh-ink-soft); margin: 6px 4px 2px; min-height: 1.4em; }
  #nhac:empty { display: none; }
</style></head>
<body class="lh"><div class="khung">
  <div class="trai">
    <a class="ve-menu" href="#" onclick="if (window.sketchup) sketchup.mo_menu(); return false;">‹ Tạo Modul Nhanh</a>
    <div class="lh-title">Khung bao tủ lạnh</div>
    <div><button class="lh-btn lh-btn--ghost" id="macdinh" style="padding:3px 10px;font-size:11px;width:auto;margin-top:4px"
                 title="Trả mọi ô số về mặc định xưởng">Về mặc định</button></div>
    <div id="form"></div>
    <div class="tinh"><span>Tủ trên (tự tính)</span><b id="tutren">—</b></div>
    <div class="day">
      <div id="nhac" class="lh-status"></div>
      <button class="lh-btn lh-btn--primary" id="dung" disabled>Dựng vào model</button>
    </div>
  </div>
  <div class="phai">
    <div class="cu">
      <span class="ten">Xem 3D</span>
      <button class="lh-btn lh-btn--ghost" id="goc">Nhìn cả tủ</button>
      <span class="goi">bấm vào ô số → 3D quay tới chỗ đó · kéo chuột: xoay · lăn: phóng · rê vào tấm: kích thước</span>
    </div>
    <div id="nen"><canvas id="c3d"></canvas><div id="tro"></div></div>
    <div id="cheDo"></div>
  </div>
</div>

<script src="ve3d.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  var NHO = 'lehai.taomodul.khungbao.v1';
  // ô nào thuộc nhóm nào — chỉ để chia tiêu đề, không chứa số liệu
  var NHOM = { rong: 'Kích thước tủ', cao_tu_lanh: 'Chia chiều cao', len_day: 'Len chân tường (0 = không có)', van: 'Ván & hậu' };

  var truong = [], dangSua = null, cuoi = null, hen = null;

  function docNho() { try { return JSON.parse(localStorage.getItem(NHO)) || {}; } catch (e) { return {}; } }
  function ghiNho(v) { try { localStorage.setItem(NHO, JSON.stringify(v)); } catch (e) {} }

  function giaTri() {
    var v = {};
    truong.forEach(function (t) { v[t.khoa] = $('o_' + t.khoa).value; });
    return v;
  }

  // ── Ruby đẩy danh sách ô + mặc định từ lõi ──
  window.khoiDau = function (ds) {
    truong = ds;
    var nho = docNho(), html = '';
    ds.forEach(function (t) {
      if (NHOM[t.khoa]) html += '<div class="nhom">' + NHOM[t.khoa] + '</div>';
      var v = nho[t.khoa] != null ? nho[t.khoa] : t.mac_dinh;
      html += '<div class="o" id="dong_' + t.khoa + '"><label for="o_' + t.khoa + '">' + t.nhan +
              '</label><input class="lh-input" id="o_' + t.khoa + '" type="number" min="0" step="0.5" value="' + v + '"></div>';
    });
    $('form').innerHTML = html;
    ds.forEach(function (t) {
      var o = $('o_' + t.khoa);
      o.addEventListener('input', guiTinh);
      o.addEventListener('focus', function () { chon(t.khoa); });
      o.addEventListener('blur', function () { chon(null); });
      o.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !$('dung').disabled) bamDung(); });
    });
    guiTinh();
  };

  // Ô đang sửa: tô dòng; 3D nhảy tới đúng chỗ của ô đó (khoa3d). Rời ô (bấm sang canvas để xoay)
  // KHÔNG đổi chỗ đứng 3D — nếu không, vừa bấm vào hình để xoay là hình bay mất.
  function chon(k) {
    dangSua = k;
    truong.forEach(function (t) { $('dong_' + t.khoa).classList.toggle('dang', t.khoa === k); });
    if (!k) return;
    var cu = cheDo(khoa3d);
    khoa3d = k;
    if (cuoi) { ve(cuoi); if (cheDo(k) !== cu || cheDo(k) !== 'tong') bayToi(k); }
  }

  function guiTinh() {
    clearTimeout(hen);
    hen = setTimeout(function () {
      var v = giaTri();
      ghiNho(v);
      if (window.sketchup) sketchup.tinh(JSON.stringify(v));
    }, 120);
  }

  function nhac(msg, loai) {
    $('nhac').textContent = msg || '';
    $('nhac').className = 'lh-status' + (loai ? ' lh-status--' + loai : '');
  }

  window.veLai = function (d) { cuoi = d; nhac(''); $('dung').disabled = false; ve(d); };
  window.baoLoi = function (m) { nhac(m, 'bad'); $('dung').disabled = true; };   // thông số sai
  window.baoLoiDung = function (m) { nhac(m, 'bad'); $('dung').disabled = false; };
  window.xong = function (m) { nhac(m, 'ok'); $('dung').disabled = false; };

  function bamDung() {
    $('dung').disabled = true;
    nhac('Đang dựng…');
    if (window.sketchup) sketchup.dung(JSON.stringify(giaTri()));
  }
  $('dung').addEventListener('click', bamDung);
  // Về mặc định: số lấy từ lõi Ruby (truong[].mac_dinh) — bảng nhớ số cũ, gõ nhầm là nhớ mãi (Khoa 27/09)
  $('macdinh').addEventListener('click', function () {
    truong.forEach(function (t) { $('o_' + t.khoa).value = t.mac_dinh; });
    guiTinh();
  });

  // ── 3D: bộ vẽ dùng chung ui/ve3d.js ─────────────────
  // Hình lấy NGUYÊN từ danh sách tấm lõi Ruby gửi (tam) + tường/len nền (nen). JS chỉ đặt
  // camera và kẻ đường kích thước từ số lõi trả về — không công thức kết cấu thứ hai.
  var v3 = new Ve3D($('c3d'), $('tro'));
  v3.gioiHanPitch(-0.2, 1.55);            // tủ cao 2,5m: không cho lật ngửa khó nhìn
  var khoa3d = null;                      // ô gần nhất đã chọn → quyết định chỗ đứng 3D + số sáng
  $('goc').addEventListener('click', function () { khoa3d = null; if (cuoi) ve(cuoi); bayToi(null); });

  // Ô nào nhìn ở đâu (Khoa chốt 27/09: sửa ô nào 3D tự quay tới chỗ đó)
  function cheDo(k) {
    if (['van', 'van_hau', 'hau_lui', 'ranh_hau'].indexOf(k) >= 0) return 'hau';   // cắt ngang tủ trên, nhìn từ trên
    if (['len_day', 'len_cao'].indexOf(k) >= 0) return 'len';               // góc sau-dưới, nhìn từ cạnh phải
    return 'tong';                                                          // cả tủ
  }
  var TEN_CHE_DO = {
    hau: 'Cắt ngang tủ trên, nhìn từ trên xuống: tường · hậu · rãnh hậu ăn vào hông · bề dày ván',
    len: 'Góc sau-dưới, nhìn từ cạnh phải: len chân tường + chỗ khoét hông',
    tong: ''
  };

  function bayToi(k) {
    if (!cuoi) return;
    var p = cuoi.tham_so, W = p.rong, D = p.sau, H = p.cao, Hd = p.cao_tu_lanh, Hb = p.cao_ba_noc, t = p.van;
    var R = Math.sqrt(W * W + D * D + H * H) / 2;   // bán kính cả tủ = mốc tỉ lệ của bộ vẽ
    var c = cheDo(k);
    if (c === 'hau') v3.bay({ yaw: 0, pitch: Math.PI / 2, zoom: R / 130, tam: [t + 45, D - 45, (Hd + H - Hb) / 2] });
    else if (c === 'len') v3.bay({ yaw: -Math.PI / 2, pitch: 0.1, zoom: R / 320, tam: [W, D - 140, Math.max(p.len_cao, 60) + 60] });
    else v3.bay({ yaw: -0.6, pitch: 0.3, zoom: 1, tam: null });
  }

  function ve(d) {
    var p = d.tham_so, tam = d.tam;
    var W = p.rong, D = p.sau, H = p.cao, Hd = p.cao_tu_lanh, Hb = p.cao_ba_noc, t = p.van;
    $('tutren').textContent = so(H - Hd - Hb) + ' mm';
    var c = cheDo(khoa3d);
    $('cheDo').textContent = TEN_CHE_DO[c];

    var ds = tam.map(function (s) { return { s: s, loai: 'tam' }; });
    (d.nen || []).forEach(function (s) { ds.push({ s: s, loai: 'nen' }); });

    // Đường kích thước: số lấy từ thông số + vị trí tấm lõi trả về; ô đang sửa thì sáng
    var K = [];
    function kk(a, b, chu, khoa) { K.push({ a: a, b: b, chu: chu, sang: !!khoa && khoa === khoa3d }); }
    var hau = tam.filter(function (s) { return s.ten === 'Hậu trên'; })[0];
    var zc = (Hd + H - Hb) / 2;             // cao độ cắt ngang giữa tủ trên
    v3.cat(c === 'hau' && hau ? { truc: 2, max: zc, min: zc - 40 } : null);   // lát mỏng 40mm quanh chỗ cắt
    if (c === 'hau' && hau) {
      kk([hau.x[0], hau.y[0] - 25, zc], [t, hau.y[0] - 25, zc], so(p.ranh_hau), 'ranh_hau');
      kk([t + 40, hau.y[1], zc], [t + 40, D, zc], so(p.hau_lui), 'hau_lui');
      kk([t + 75, hau.y[0], zc], [t + 75, hau.y[1], zc], so(p.van_hau), 'van_hau');
      kk([0, D - 100, zc], [t, D - 100, zc], so(t), 'van');
    } else if (c === 'len') {
      if (p.len_day > 0 && p.len_cao > 0) {
        kk([W + 5, D - p.len_day, p.len_cao + 25], [W + 5, D, p.len_cao + 25], so(p.len_day), 'len_day');
        kk([W + 5, D - p.len_day - 25, 0], [W + 5, D - p.len_day - 25, p.len_cao], so(p.len_cao), 'len_cao');
      }
    } else {
      var o = 90;                           // kẻ lệch ra ngoài tủ cho khỏi đè tấm
      kk([0, -o, 0], [W, -o, 0], so(W), 'rong');
      kk([-o, 0, 0], [-o, 0, H], so(H), 'cao');
      kk([-o, 0, 0], [-o, D, 0], so(D), 'sau');
      kk([W + o, 0, 0], [W + o, 0, Hd], so(Hd), 'cao_tu_lanh');
      kk([W + o, 0, Hd], [W + o, 0, H - Hb], so(H - Hd - Hb), null);   // tủ trên tự tính
      kk([W + o, 0, H - Hb], [W + o, 0, H], so(Hb), 'cao_ba_noc');
    }
    v3.kich(K);
    v3.dat(ds, [[0, 0, 0], [W, D, H]]);   // căn theo tủ, không theo tường
  }

  function so(v) { return Math.round(v * 10) / 10; }

  if (window.sketchup) sketchup.ready();
</script>
</body></html>
