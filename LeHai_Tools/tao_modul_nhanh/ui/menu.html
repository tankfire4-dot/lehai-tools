<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<title>Tạo Modul Nhanh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/lehai_theme.css">
<style>
  html, body { height: 100%; margin: 0; }
  .khung { box-sizing: border-box; padding: 18px; }
  .luoi { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 14px; }
  .the { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px;
         background: var(--lh-surface); border: 1.5px solid transparent; border-radius: var(--lh-radius);
         box-shadow: var(--lh-shadow); padding: 16px 12px 14px; cursor: pointer; font: inherit; color: inherit; }
  .the:hover, .the:focus-visible { border-color: var(--lh-amber); outline: none; }
  .the svg { width: 64px; height: 64px; }
  .the svg * { fill: none; stroke: var(--lh-walnut); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .the svg .nhat { stroke-width: 1.4; opacity: .55; }
  .the b { font-size: 14px; color: var(--lh-ink); font-weight: 600; }
  .the span { font-size: 11.5px; color: var(--lh-muted); line-height: 1.4; }
</style></head>
<body class="lh"><div class="khung">
  <div class="lh-eyebrow">LeHai Tools</div>
  <div class="lh-title">Tạo Modul Nhanh</div>
  <!-- Chỉ modul đã xong đủ 4 bước (dò mẫu → quy tắc → lõi → dựng thật). id phải có trong main.rb MO_MODUL. -->
  <div class="luoi">
    <button class="the" data-id="khung_bao">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect x="14" y="4" width="36" height="56"/>
        <line x1="14" y1="24" x2="50" y2="24"/>
        <line x1="32" y1="4" x2="32" y2="24"/>
        <line x1="28" y1="12" x2="28" y2="16"/><line x1="36" y1="12" x2="36" y2="16"/>
        <rect class="nhat" x="19" y="28" width="26" height="30" rx="3"/>
        <line class="nhat" x1="19" y1="38" x2="45" y2="38"/>
      </svg>
      <b>Khung bao tủ lạnh</b>
      <span>Nhập kích thước → dựng khung bao + tủ trên</span>
    </button>
    <button class="the" data-id="hoc_keo">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect x="8" y="8" width="48" height="48"/>
        <rect x="12" y="12" width="40" height="12"/>
        <rect x="12" y="26" width="40" height="12"/>
        <rect x="12" y="40" width="40" height="12"/>
        <line x1="26" y1="18" x2="38" y2="18"/>
        <line x1="26" y1="32" x2="38" y2="32"/>
        <line x1="26" y1="46" x2="38" y2="46"/>
      </svg>
      <b>Hộc kéo</b>
      <span>Rê chuột vào khoang tủ → dựng hộc ray bi</span>
    </button>
  </div>
</div>
<script>
  Array.prototype.forEach.call(document.querySelectorAll('.the'), function (b) {
    b.addEventListener('click', function () { if (window.sketchup) sketchup.mo(b.dataset.id); });
  });
</script>
</body></html>
