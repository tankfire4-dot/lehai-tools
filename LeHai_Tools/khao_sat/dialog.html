<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Khảo sát hiện trường → 3D</title>
<style>
  /* Theme LeHai (kem + walnut + amber) — đồng bộ shared/lehai_theme.css */
  :root { --ink: #1c0a00; --ink-2: #6b4226; --ink-3: #a08060; --line: rgba(124,45,18,0.18); --bg: #f5f0e8; --accent: #7c2d12;
    --accent-soft: #fef3c7; --warn: #92400e; --warn-soft: #fef3c7; --bad: #a33a2a; --bad-soft: #f8e9e6; --good: #2f7a52; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; font: 13.5px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  h2 { font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 14px 2px 6px; text-transform: uppercase; letter-spacing: .3px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .row { display: flex; gap: 8px; align-items: center; }
  input[type=text] { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  button { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font: inherit; cursor: pointer; }
  button:hover { border-color: #cfcdc7; }
  button.pri { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; width: 100%; padding: 10px; }
  button:disabled { opacity: .5; cursor: default; }
  .muted { color: var(--ink-3); font-size: 12px; }
  .item { display: flex; gap: 10px; align-items: center; padding: 8px 6px; border-radius: 8px; cursor: pointer; }
  .item:hover { background: #f7f7f5; }
  .item.on { background: var(--accent-soft); }
  .item .t { font-weight: 600; }
  input[type=checkbox] { accent-color: var(--accent); }
  .item .s { font-size: 12px; color: var(--ink-3); }
  .item.off .t { color: var(--ink-3); }
  #status { margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 12.5px; white-space: pre-wrap; display: none; }
  #status.info { display: block; background: var(--accent-soft); color: var(--ink-2); }
  #status.ok { display: block; background: #e8f3ec; color: var(--good); }
  #status.bad { display: block; background: var(--bad-soft); color: var(--bad); }
  #log { margin-top: 8px; font-size: 12px; color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 8px 12px; display: none; max-height: 200px; overflow: auto; }
  #log div { padding: 2px 0; }
</style>
</head>
<body>
  <h2>Nguồn số đo</h2>
  <div class="card">
    <div class="muted" style="margin-bottom:6px">Link Sheet (đuôi /exec) — giống link dán trong app điện thoại.</div>
    <div class="row"><input type="text" id="url" placeholder="https://script.google.com/macros/s/…/exec"><button id="luu">Lưu</button></div>
    <div class="row" style="margin-top:8px">
      <button id="laySheet" style="flex:1">Lấy danh sách từ Sheet</button>
      <button id="moFile" style="flex:1">Mở file JSON (app xuất)</button>
    </div>
  </div>

  <h2 id="hCt" style="display:none">Công trình</h2>
  <div class="card" id="dsCt" style="display:none"></div>

  <h2 id="hPh" style="display:none">Phòng — chọn phòng cần dựng</h2>
  <div class="card" id="dsPh" style="display:none"></div>
  <div id="khuDung" style="display:none;margin-top:10px">
    <button class="pri" id="dung">Dựng 3D</button>
    <div class="muted" style="margin-top:6px">Mỗi phòng một group, đặt cạnh nhau từ trái sang phải (app chưa lưu phòng nào nằm cạnh phòng nào). Ctrl+Z một lần là xoá hết.</div>
  </div>

  <div id="status"></div>
  <div id="log"></div>

<script src="js/geometry.js"></script>
<script src="js/danh-muc.js"></script>
<script src="js/dung3d.js"></script>
<script>
// Bảng chọn: Ruby lo tải dữ liệu (Sheet / file), JS tính khối bằng Dung3D (chung lõi với app), Ruby lo vẽ.
// Ruby gọi vào đây qua KS.* ; ở đây gọi Ruby qua sketchup.<tên>(...). KHÔNG dùng fetch (HtmlDialog SU2024 có thể treo).
var KS = (function () {
  var st = { nguon: null, dsCt: [], file: null, ct: null, chon: {} };
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function status(text, kind) { var el = $('status'); el.className = kind || 'info'; el.textContent = text; }
  function log(lines) { var el = $('log'); el.style.display = lines.length ? 'block' : 'none'; el.innerHTML = lines.map(function (l) { return '<div>• ' + esc(l) + '</div>'; }).join(''); }
  function show(id, on) { $(id).style.display = on ? '' : 'none'; }
  function goiSheet(tag, body) { status('Đang tải từ Sheet…'); sketchup.goi_sheet(tag, JSON.stringify(body)); }

  function veCongTrinh(list) {
    st.dsCt = list || [];
    show('hCt', true); show('dsCt', true); show('hPh', false); show('dsPh', false); show('khuDung', false); log([]);
    $('dsCt').innerHTML = st.dsCt.length ? st.dsCt.map(function (p, i) {
      return '<div class="item" data-i="' + i + '"><div style="flex:1"><div class="t">' + esc(p.name) + '</div><div class="s">' +
        esc([p.customer, (p.rooms != null ? (p.rooms.length != null ? p.rooms.length : p.rooms) + ' phòng' : ''), p.updated].filter(Boolean).join(' · ')) + '</div></div><span class="muted">›</span></div>';
    }).join('') : '<div class="muted">Chưa có công trình nào.</div>';
    Array.prototype.forEach.call($('dsCt').querySelectorAll('.item'), function (el) {
      el.onclick = function () { chonCongTrinh(Number(el.getAttribute('data-i'))); };
    });
    status('Chọn một công trình.', 'info');
  }
  function chonCongTrinh(i) {
    var p = st.dsCt[i];
    Array.prototype.forEach.call($('dsCt').querySelectorAll('.item'), function (el) { el.classList.toggle('on', Number(el.getAttribute('data-i')) === i); });
    if (st.nguon === 'file') return vePhong(p);
    goiSheet('pull', { action: 'pull', projectId: p.id, have: {} });
  }
  function vePhong(p) {
    st.ct = p; st.chon = {};
    (p.rooms || []).forEach(function (r) { if (Dung3D.roomState(r).ok) st.chon[r.id] = true; });
    show('hPh', true); show('dsPh', true); show('khuDung', true);
    $('dsPh').innerHTML = (p.rooms || []).map(function (r) {
      var s = Dung3D.roomState(r);
      return '<label class="item' + (s.ok ? '' : ' off') + '"><input type="checkbox" data-id="' + esc(r.id) + '"' + (st.chon[r.id] ? ' checked' : '') + (s.ok ? '' : ' disabled') + '>' +
        '<div style="flex:1"><div class="t">' + esc(r.name) + '</div><div class="s">' + esc(s.text) + '</div></div></label>';
    }).join('') || '<div class="muted">Công trình chưa có phòng.</div>';
    Array.prototype.forEach.call($('dsPh').querySelectorAll('input[type=checkbox]'), function (cb) {
      cb.onchange = function () { st.chon[cb.getAttribute('data-id')] = cb.checked; };
    });
    var n = Object.keys(st.chon).length;
    status(n ? 'Đã chọn sẵn ' + n + ' phòng đủ số đo. Bấm Dựng 3D.' : 'Chưa phòng nào đủ số đo để dựng.', n ? 'info' : 'bad');
    log([]);
  }
  function dung() {
    var ids = Object.keys(st.chon).filter(function (k) { return st.chon[k]; });
    if (!ids.length) return status('Chưa chọn phòng nào.', 'bad');
    var plan = Dung3D.build(st.ct, ids), canh = [];
    plan.skipped.forEach(function (s) { canh.push('Bỏ qua ' + s); });
    plan.rooms.forEach(function (r) { r.warnings.forEach(function (w) { canh.push(r.name + ': ' + w); }); });
    st.canh = canh;
    status('Đang dựng ' + plan.rooms.length + ' phòng trong SketchUp…');
    $('dung').disabled = true;
    sketchup.dung(JSON.stringify(plan));
  }
  return {
    cauHinh: function (c) { $('url').value = (c && c.url) || ''; },
    nhanSheet: function (tag, res) {
      if (!res || !res.ok) return status('Sheet báo lỗi: ' + ((res && res.err) || 'không rõ'), 'bad');
      if (tag === 'list') { st.nguon = 'sheet'; return veCongTrinh(res.projects); }
      if (tag === 'pull') {
        if (!res.project) return status('Công trình này không còn trên Sheet.', 'bad');
        var p = res.project; p.rooms = res.rooms.map(function (x) { return x.room; }).filter(Boolean);
        vePhong(p);
      }
    },
    nhanFile: function (d) {
      if (!d || !d.projects) return status('File không phải JSON xuất từ app khảo sát (thiếu "projects").', 'bad');
      st.nguon = 'file'; veCongTrinh(d.projects);
    },
    xong: function (r) {
      $('dung').disabled = false;
      var loi = (r && r.loi) || [];
      status(loi.length ? 'Đã dựng — ' + loi.length + ' khối lỗi (xem dưới).' : 'Đã dựng xong. Tag KS_… để bật/tắt từng loại; trần (KS_Tran) đang ẩn.', loi.length ? 'bad' : 'ok');
      log(loi.map(function (l) { return 'LỖI ' + l; }).concat(st.canh || []));
    },
    loi: function (msg) { $('dung').disabled = false; status(msg, 'bad'); },
    // để test ngoài SketchUp
    _st: st, _dung: dung,
    init: function () {
      $('luu').onclick = function () { sketchup.luu_url($('url').value.trim()); status('Đã lưu link.', 'ok'); };
      $('laySheet').onclick = function () {
        var u = $('url').value.trim();
        if (!/\/exec(\?|$)/.test(u)) return status('Dán link Sheet đuôi /exec trước.', 'bad');
        sketchup.luu_url(u); goiSheet('list', { action: 'list' });
      };
      $('moFile').onclick = function () { sketchup.mo_file(); };
      $('dung').onclick = dung;
      sketchup.ready();
    }
  };
})();
document.addEventListener('DOMContentLoaded', KS.init);
</script>
</body>
</html>
